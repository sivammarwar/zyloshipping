# Railway deployment — set root directory to repo root or backend per your layout.
# If deploying only backend service, set Root Directory to `backend` and adjust Dockerfile path.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.simple"
watchPatterns = ["Dockerfile", "backend/**", "shared/**", "package*.json"]

[deploy]
startCommand = "sh -c 'npx prisma db push --accept-data-loss && npx prisma db seed || true && node dist/index.js'"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"

# Force cache invalidation - change this timestamp to trigger fresh build
[build.env]
CACHE_BUST = "202504021900"
